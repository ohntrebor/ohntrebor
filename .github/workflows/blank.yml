# 🐍 Gera a animação da snake comendo suas contribuições.
# Os SVGs são publicados no branch "output" e referenciados no readme.md.

name: 🐍 Generate Snake

on:
  schedule:
    # A cada 12 horas
    - cron: "0 */12 * * *"

  # Permite rodar manualmente pela aba Actions
  workflow_dispatch:

  # Regenera automaticamente ao atualizar o perfil
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Gera as versões light e dark da snake
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ohntrebor
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publica os SVGs no branch "output" (mantém o main limpo)
      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
